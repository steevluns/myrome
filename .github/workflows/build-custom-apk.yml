name: Build MyChatGpt cosmetic APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-custom-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Android build tools and APK decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
      - name: Locate preinstalled Android build tools
        run: |
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "BT=$BT" >> "$GITHUB_ENV"
      - name: Download original APK from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/steevluns/myrome/releases/assets/701536382" \
            -o original.apk
          test "$(stat -c%s original.apk)" -gt 1000000
      - name: Decode APK
        run: java -jar apktool.jar d -f original.apk -o decoded
      - name: Give MyChatGpt a separate Android package name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("decoded")
          old_dot = "com.openai.chatgpt"
          new_dot = "com.openai.mychatgpt"
          old_slash = "com/openai/chatgpt"
          new_slash = "com/openai/mychatgpt"

          manifest = root / "AndroidManifest.xml"
          xml = manifest.read_text(encoding="utf-8")
          xml, count = re.subn(r'(<manifest\\b[^>]*\\bpackage=")[^"]+("?)',
                               r'\\g<1>' + new_dot + r'\\2', xml, count=1)
          if count != 1:
              raise SystemExit("Could not change manifest package name")
          xml = xml.replace(old_dot, new_dot).replace(old_slash, new_slash)
          manifest.write_text(xml, encoding="utf-8")

          changed = 0
          for p in root.rglob("*"):
              if not p.is_file() or p == manifest:
                  continue
              try:
                  data = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = data.replace(old_dot, new_dot).replace(old_slash, new_slash)
              if updated != data:
                  p.write_text(updated, encoding="utf-8")
                  changed += 1

          print(f"Package set to {new_dot}; updated package references in {changed} files.")
          PY
      - name: Change app label and make launcher icon gray
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image

          root = Path("decoded/res")
          changed = 0
          for p in root.rglob("*.xml"):
              if not any(parent.name.startswith("values") for parent in p.parents):
                  continue
              s = p.read_text(encoding="utf-8")
              ns, n = re.subn(
                  r'(<string[^>]*\bname="91"[^>]*>).*?(</string>)',
                  r'\g<1>MyChatGpt\g<2>',
                  s,
                  flags=re.S
              )
              if not n:
                  ns, n = re.subn(
                      r'(<string[^>]*>\s*)ChatGPT(\s*</string>)',
                      r'\g<1>MyChatGpt\g<2>',
                      s,
                      count=1
                  )
              if n:
                  p.write_text(ns, encoding="utf-8")
                  changed += n
          if not changed:
              print("Resource candidates:")
              for p in root.rglob("*.xml"):
                  if "values" in str(p):
                      for line in p.read_text(encoding="utf-8", errors="ignore").splitlines():
                          if "ChatGPT" in line or 'name="91"' in line:
                              print(p, line[:300])
              raise SystemExit("Could not locate the launcher app label string")

          colors = root / "values" / "colors.xml"
          s = colors.read_text(encoding="utf-8")
          s, n = re.subn(
              r'(<color\s+name="ic_launcher_foreground">).*?(</color>)',
              r'\g<1>#ff808080\g<2>',
              s,
              count=1,
              flags=re.S
          )
          if not n:
              raise SystemExit("Could not find launcher foreground color")
          colors.write_text(s, encoding="utf-8")

          for p in root.glob("mipmap-*/ic_launcher.webp"):
              im = Image.open(p).convert("RGBA")
              gray = im.convert("L").convert("RGBA")
              gray.putalpha(im.getchannel("A"))
              gray.save(p, "WEBP", lossless=True, quality=100)

          print(f"Updated app label in {changed} localized resource(s); launcher artwork converted to grayscale.")
          PY
      - name: Rebuild APK
        run: java -jar apktool.jar b decoded -o rebuilt-unsigned.apk
      - name: Align and sign APK
        run: |
          "$BT/zipalign" -f -p 4 rebuilt-unsigned.apk MyChatGpt-unsigned-aligned.apk
          keytool -genkeypair -v \
            -keystore debug-release.jks \
            -storepass android -keypass android \
            -alias mychatgpt -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MyChatGpt, OU=Build, O=Local, L=NA, S=NA, C=US"
          "$BT/apksigner" sign \
            --ks debug-release.jks --ks-pass pass:android --key-pass pass:android \
            --out MyChatGpt.apk MyChatGpt-unsigned-aligned.apk
          "$BT/apksigner" verify --verbose MyChatGpt.apk
          BADGING="$("$BT/aapt" dump badging MyChatGpt.apk | head -n 3)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.openai.mychatgpt'"
      - name: Upload modified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyChatGpt-parallel-install-build
          path: MyChatGpt.apk
          retention-days: 14
