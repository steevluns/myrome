name: Inspect original APK
on:
  push:
    paths:
      - ".github/workflows/inspect-original-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install APK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
      - name: Download uploaded APK from draft release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/steevluns/myrome/releases/assets/701536382" \
            -o original.apk
          file original.apk
          test "$(stat -c%s original.apk)" -gt 1000000
      - name: Decode APK and collect inspection report
        run: |
          apktool d -f original.apk -o decoded
          {
            echo "## APK metadata"
            aapt dump badging original.apk | head -n 8 || true
            echo
            echo "## Manifest"
            sed -n '1,260p' decoded/AndroidManifest.xml
            echo
            echo "## Storage-related resources and code"
            grep -RilE 'Manage Library Storage|storage|select all|selectAll|file list|files' decoded/res decoded/smali* 2>/dev/null | head -n 250 || true
            echo
            echo "## App name candidates"
            grep -RinE 'app_name|ChatGPT' decoded/res/values* 2>/dev/null | head -n 100 || true
          } > inspection-report.txt
          cat inspection-report.txt
      - name: Upload decoded APK and report for analysis
        uses: actions/upload-artifact@v4
        with:
          name: apk-inspection
          path: |
            inspection-report.txt
            decoded/
          retention-days: 7
